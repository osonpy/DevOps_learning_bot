# bot va migrate uchun umumiy sozlamalar (bir xil image)
x-app: &app
  build: .
  image: ${BOT_IMAGE:-devops-quest-bot}:${IMAGE_TAG:-local}
  env_file: .env
  environment:
    # Parol faqat .env dagi POSTGRES_PASSWORD da — URL shu yerda yig'iladi
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}@db:5432/${POSTGRES_DB:-devops_quest}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  networks: [backend]

services:
  db:
    # Digest bilan qotirilgan (16-alpine, multi-arch index). Yangilash: docker buildx imagetools inspect postgres:16-alpine
    image: &postgres_image postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      POSTGRES_DB: ${POSTGRES_DB:-devops_quest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Port tashqariga ochilmaydi (11-kun: Docker + ufw tuzog'i). Lokal debug uchun:
    # ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {memory: 512M}
    networks: [backend]

  # Bir martalik: migratsiya + seed. Muvaffaqiyatli tugasa bot ishga tushadi.
  migrate:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && python -m src.scripts.seed"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  bot:
    <<: *app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 256M}

  # Kunlik pg_dump -> ./backups (7 kun). Qo'lda: docker compose run --rm backup now
  backup:
    image: *postgres_image
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    # ./backups egasi (host'dagi deploy user) — fayllar ham unga tegishli bo'ladi. Oldindan: mkdir -p backups
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-devops}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      PGDATABASE: ${POSTGRES_DB:-devops_quest}
      BACKUP_HOUR: 3  # UTC (Toshkent 08:00)
      BACKUP_KEEP_DAYS: 7
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits: {memory: 128M}
    networks: [backend]

  # 19-kun: `docker compose --profile tools up -d`
  adminer:
    image: adminer:4
    profiles: [tools]
    ports: ["127.0.0.1:8081:8080"]
    networks: [backend]

volumes:
  pgdata:

networks:
  backend:
