services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      POSTGRES_DB: ${POSTGRES_DB:-devops_quest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Port tashqariga ochilmaydi (11-kun: Docker + ufw tuzog'i). Lokal debug uchun:
    # ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  bot:
    build: .
    image: ${BOT_IMAGE:-devops-quest-bot}:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      # Parol faqat .env dagi POSTGRES_PASSWORD da — URL shu yerda yig'iladi
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}@db:5432/${POSTGRES_DB:-devops_quest}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 256M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [backend]

  # 19-kun: `docker compose --profile tools up -d`
  adminer:
    image: adminer:4
    profiles: [tools]
    ports: ["127.0.0.1:8081:8080"]
    networks: [backend]

volumes:
  pgdata:

networks:
  backend:
